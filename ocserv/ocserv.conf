# ============================================================
# ocserv.conf
# ============================================================
# --- Runtime identity ---
run-as-user = ocserv
run-as-group = ocserv
socket-file = /run/ocserv-socket
chroot-dir = /var/lib/ocserv
isolate-workers = true
# --- Network interface ---
device = op
mtu = 1420
# --- Logging ---
log-level = 0
# --- Auth: plain password only ---
auth = "plain[/etc/ocserv/ocpasswd]"
# --- Client limits ---
max-clients = 0
max-same-clients = 0
# --- Listen ports ---
tcp-port = 8443
# udp-port = 8443
# --- MTU auto-discovery ---
try-mtu-discovery = true
# --- Certificate ---
server-cert = /etc/ocserv/server.pem
server-key = /etc/ocserv/server.key
# --- DNS ---
dns = 100.100.100.100
tunnel-all-dns = true
# --- Full tunnel: push default route to client ---
route = default
# --- Also push tailnet routes so clients can reach tailnet nodes ---
route = 100.64.0.0/10
route = fd7a:115c:a1e0::/48
# --- Keepalive / DPD ---
keepalive = 32400
dpd = 90
mobile-dpd = 1800
# --- restrictions settings ---
output-buffer = 0
rate-limit-ms = 0
restrict-user-to-routes = false
restrict-user-to-ports = ""
# --- DTLS/TLS ---
dtls-legacy = false
switch-to-tcp-timeout = 30
tls-priorities = "NORMAL:%SERVER_PRECEDENCE:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1:-VERS-TLS1.2"
# --- Compression ---
compression = false
no-compress-limit = 0
# --- No rate limiting ---
rx-data-per-sec = 0
tx-data-per-sec = 0
# --- Auth-related ---
auth-timeout = 240
ban-time = 300
max-ban-score = 80
ban-reset-time = 1200
# --- Session ---
cookie-timeout = 86400
rekey-time = 172800
deny-roaming = false
use-occtl = true
# --- Subnet settings ---
ipv4-network = 10.255.255.0/24
ipv6-network = fd00:aaaa:bbbb::/64
ipv6-subnet-prefix = 128
client-bypass-protocol = false
predictable-ips = true
ping-leases = true
net-priority = 6
# --- Camouflage settings ---
camouflage = true
camouflage_secret = "tail2net"
